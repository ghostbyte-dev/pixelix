app-id: dev.ghostbyte.pixelix
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21
command: pixelix

finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --device=dri

modules:
  - name: pixelix
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/openjdk21/bin
      env:
        JAVA_HOME: /usr/lib/sdk/openjdk21/jvm/openjdk-21
        GRADLE_USER_HOME: /run/build/pixelix/gradle-home
        OFFLINE_REPO: /run/build/pixelix/offline-repository
    build-commands:
      - rm -f gradle/gradle-daemon-jvm.properties

      - sed -i '/^flatpakSources {/,/^}/d' build.gradle.kts
      - sed -i '/org.meshtastic.flatpak.sources.settings/d' settings.gradle.kts
      - sed -i '/org.gradle.toolchains.foojay-resolver-convention/d' settings.gradle.kts

      - >-
        gradle-dist/bin/gradle
        --offline --no-daemon --no-build-cache --no-configuration-cache
        --init-script offline.init.gradle
        -PflatpakBuild=true
        -Pkotlin.native.ignoreDisabledTargets=true
        -Porg.gradle.java.installations.auto-download=false
        -Porg.gradle.java.installations.paths=/usr/lib/sdk/openjdk21/jvm/openjdk-21
        :desktopApp:createDistributable

      - mkdir -p /app/pixelix /app/bin
      - cp -r desktopApp/build/compose/binaries/main/app/*/. /app/pixelix/
      - ln -s "/app/pixelix/bin/$(ls /app/pixelix/bin | head -n1)" /app/bin/pixelix

      - install -Dm644 flatpak-assets/dev.ghostbyte.pixelix.desktop /app/share/applications/dev.ghostbyte.pixelix.desktop
      - install -Dm644 flatpak-assets/dev.ghostbyte.pixelix.metainfo.xml /app/share/metainfo/dev.ghostbyte.pixelix.metainfo.xml
      - install -Dm644 flatpak-assets/dev.ghostbyte.pixelix.png /app/share/icons/hicolor/512x512/apps/dev.ghostbyte.pixelix.png

    sources:
      # Your project (the manifest lives in flatpak-assets/, so go one level up)
      - type: dir
        path: ..
        skip:
          - build
          - .gradle
          - .git
          - .idea
          - .kotlin
          - '*/build'

      # Maven artifacts generated by captureFlatpakSources
      - flatpak-sources.json

      # Gradle distribution (the wrapper can't download it offline)
      - type: archive
        url: https://services.gradle.org/distributions/gradle-9.5.0-bin.zip
        sha256: 553c78f50dafcd54d65b9a444649057857469edf836431389695608536d6b746
        dest: gradle-dist

      # Make Gradle resolve everything from the offline repo
      - type: inline
        dest-filename: offline.init.gradle
        contents: |
          def repoUri = new File(System.getenv('OFFLINE_REPO')).toURI()

          settingsEvaluated { settings ->
              settings.pluginManagement.repositories {
                  clear()
                  maven { url repoUri }
              }
              settings.dependencyResolutionManagement.repositories {
                  clear()
                  maven { url repoUri }
              }
          }

          allprojects {
              buildscript.repositories {
                  clear()
                  maven { url repoUri }
              }
              repositories {
                  clear()
                  maven { url repoUri }
              }
          }