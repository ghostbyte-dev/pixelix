"project_id_env": "CROWDIN_PROJECT_ID"
"api_token_env": "CROWDIN_PERSONAL_TOKEN"
"base_path": "."

"preserve_hierarchy": true

"files": [
  {
    "source": "/app/src/commonMain/composeResources/values/strings.xml",
    "translation": "/app/src/commonMain/composeResources/values-%android_code%/strings.xml",
    "type": "xml",  # <--- Change this from 'android' to 'xml'
    "content_segmentation": 0,
    "parser_config": {
      "escape_quotes": 0,
      "escape_special_characters": 0
    }
  },
  {
    "source": "/metadata/en-US/full_description.txt",
    "translation": "/metadata/%locale%/full_description.txt"
  },
  {
    "source": "/metadata/en-US/short_description.txt",
    "translation": "/metadata/%locale%/short_description.txt"
  },
]