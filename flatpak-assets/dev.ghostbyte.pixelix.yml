app-id: dev.ghostbyte.pixelix
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21
command: pixelix

build-options:
  env:
    JAVA_HOME: /usr/lib/sdk/openjdk21/jvm/openjdk-21
    PATH: /usr/local/bin:/usr/bin:/bin:/usr/lib/sdk/openjdk21/bin
    NO_AT_BRIDGE: '1'

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.OpenURI
  - --env=GTK_USE_PORTAL=1
  - --env=XDG_SESSION_TYPE=wayland

modules:
  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk21/install.sh

  - name: pixelix
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/pixelix
      - mkdir -p /app/bin

      - cp -r ./* /app/lib/pixelix/
      - find /app/lib/pixelix -type f -name "Pixelix" -exec chmod +x {} +
      - ln -sf $(find /app/lib/pixelix -type f -name "Pixelix") /app/bin/pixelix

      - install -D dev.ghostbyte.pixelix.desktop /app/share/applications/dev.ghostbyte.pixelix.desktop
      - install -D dev.ghostbyte.pixelix.metainfo.xml /app/share/metainfo/dev.ghostbyte.pixelix.metainfo.xml
      - install -D dev.ghostbyte.pixelix.png /app/share/icons/hicolor/128x128/apps/dev.ghostbyte.pixelix.png
    sources:
      - type: dir
        path: ../desktopApp/build/compose/binaries/main/app
      - type: file
        path: dev.ghostbyte.pixelix.desktop
      - type: file
        path: dev.ghostbyte.pixelix.metainfo.xml
      - type: file
        path: dev.ghostbyte.pixelix.png